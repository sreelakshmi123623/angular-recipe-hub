

  <div class="container vh-100 d-flex flex-column justify-content-center align-items-center">

    <!-- Heading -->
    <h1 class="display-2 fw-normal text-dark mb-3">
      Login
    </h1>

    <!-- Subtitle -->
    <p class="text-secondary fs-5 mb-5">
      Explore 100+ recipes in your hand...
    </p>

    <!-- Login Card -->
    <div class="card shadow border-0 p-4" style="width: 420px;">

      <!-- Brand -->
      <div class="fs-2 fw-medium mb-4">
        <i class="fa-solid fa-utensils me-2"></i>
        Flavour-Fusion
      </div>

      <!-- Form -->
      <form [formGroup]="loginForm" (ngSubmit)="login()" >

        <div class="mb-3">
          <input 
            type="email" 
            class="form-control form-control-lg"
            placeholder="Enter Your Email"
           name="email" formControlName="email">
        </div>

          @if(loginForm.get('email')?.errors && loginForm.get('email')?.touched){
                        <div class="text-danger fw-bolder">*Invalid Email</div>
                    }

        <div class="mb-4">
          <input 
            type="password" 
            class="form-control form-control-lg"
            placeholder="Enter Your password"
         name="password" formControlName="password" >
        </div>
          @if(loginForm.get('password')?.errors && loginForm.get('password')?.touched){
                        <div class="text-danger fw-bolder">*Invalid password</div>
                    }

        <button class="btn btn-success btn-lg w-100">
          Login
        </button>

      </form>

    </div>

  </div>
